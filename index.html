<html>
<head>
  <title>Games by kiraaamel</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,400..900&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<header>
  <a href="index.html">Регистрация пользователя</a>
</header>
<body>
  <div class="container"> 
    <img src="./icon.PNG" alt="Эмблема" class="photo">
    <p class="text">МЫ РАДЫ ВАС ПРИВЕТСТВОВАТЬ НА НАШЕМ САЙТЕ МИНИ-ИГР!</p>
  </div>
  <p class="introduction"> Прежде чем приступить к выбору игры, вы должны пройти регистрацию на нашей платформе</p>
  <form>
    <fieldset>
      <p><label>Имя: <input type="text" name="name-field" placeholder="Введите ваше имя" required></label></p>
      <p><label>Номер телефона: <input type="tel" name="tel" placeholder="+7(123)456-78-90 " required></label></p>
      <p><label>Никнейм: <input type="text" name="name-field" placeholder="Придумайте никнейм"></label></p>
      <p><label>Email: <input type="email" name="email" placeholder="Введите вашу почту"></label></p>
      <p><label for="password">Пароль: <input type="password" name="password" id="password" value="password" required></label></p>
    </fieldset>
    <button class=reg type="submit"><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
    <button class=sbros type="reset" disabled> Сбросить</button>
  </form>
</html>
