  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header>
    <div class="cont">
      <div class="head">
        <nav class="header_menu">
          <ul>
            <li>
              <a href="about_us.html">О нас</a>
            </li>
            <li>
              <a href="index.html">Регистрация</a>
            </li>
            <li>
              <a href="library.html">Библиотека игр</a>
            </li>
          </ul>
        </nav>
        <div class="header_logo">
          <h1>GAMES BY KIRAAAMEL</h1>
        </div>
        <div class="header_right">
          <div class="mobile">
            <span> Связь: </span>
            <a class="contact" href="https://vk.com/kiraaamel">VK</a>
          </div>
          <div class="header_phone"><a href="tel:8(980)6557762"><span class="hidden_mobile">8 (980) 655-77-62</span></a></div>
        </div>
      </div>
    </div>
  </header>
  <div class="firstpart">
    <div class="glasses">
      <a href="ovz_index.html">
        <img src="очки.png" alt="Очки">
        <span>Версия для слабовидящих</span>
      </a>
    </div>
    <p class="text">ДАВАЙ ПОЗНАКОМИМСЯ :)</p>
  </div>
  <div class="container">
    <div><img src="./reg.jpg" class="photoreg" alt="regphoto" loading="lazy"></div>
    <form action="library.html" method="GET">
      <fieldset>
        <legend>Регистрация</legend>
        <p><label>Имя: <input type="text" name="name-field" placeholder="Введите ваше имя" required></label></p>
        <span class="required">*обязательное поле</span>
        <p><label>Номер телефона: <input type="tel" name="tel" placeholder="+7(123)456-78-90 " required></label></p>
        <span class="required">*обязательное поле</span>
        <p><label>Никнейм: <input type="text" name="никнейм" placeholder="Придумайте никнейм"></label></p>
        <p><label>Email: <input type="email" name="email" placeholder="Введите вашу почту"></label></p>
        <p><label for="password">Пароль: <input type="password" name="password" id="password" placeholder="Придумайте пароль" required></label></p>
        <span class="required">*обязательное поле</span>
      </fieldset>
      <button type="submit" class=reg><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
    </form>
  </div>
  <footer>
    <p class="day">Хорошего дня ♡</p>
  </footer>
