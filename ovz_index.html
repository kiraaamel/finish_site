<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games by kiraaamel</title>
    <link rel="stylesheet" href="style_ovz_index.css">
</head>
<body>
    <div class="theme-switcher">
        <p class="back">
            <a href="index.html">Вернуться на главную</a>
        </p>
            <p class="style"> Стиль оформления:</p>
            <input type="radio" id="black-white" name="theme" checked>
            <label class="theme" for="black-white">Black & White</label>

            <input type="radio" id="white-black" name="theme">
            <label class="theme" for="white-black">White & Black</label>

            <input type="radio" id="white-blue" name="theme">
            <label class="theme" for="white-blue">White & Blue</label>
        <div class="theme-content">
            <div class="content">
                <div class="header">
                    <div class="cont">
                        <div class="head">
                            <nav class="header_menu">
                                <ul>
                                    <li><a href="ovz_about_us.html">О нас</a></li>
                                    <li><a href="ovz_index.html">Регистрация</a></li>
                                    <li><a href="ovz_library.html">Библиотека игр</a></li>
                                </ul>
                            </nav>
                            <div class="header_logo">
                                <p>"GAMES BY KIRAAAMEL"</p>
                            </div>
                            <div class="header_right">
                                <div class="mobile">
                                    <span>Связь: </span>
                                    <a class="contact" href="https://vk.com/kiraaamel">VK</a>
                                </div>
                                <div class="header_phone">
                                    <a href="tel:8(980)6557762"><span>8 (980) 655-77-62</span></a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <form action="ovz_library.html" method="GET">
                    <fieldset>
                        <legend>Регистрация</legend>
                        <p><label class="label">Имя: <input type="text" name="name-field" placeholder="Введите ваше имя" required></label></p>
                        <p><label class="label">Номер телефона: <input type="tel" name="tel" placeholder="+7(123)456-78-90 " required></label></p>
                        <p><label class="label">Никнейм: <input type="text" name="никнейм" placeholder="Придумайте никнейм"></label></p>
                        <p><label class="label">Email: <input type="email" name="email" placeholder="Введите вашу почту"></label></p>
                        <p><label class="label">Пароль: <input type="password" name="password" placeholder="Придумайте пароль" required></label></p>
                    </fieldset>
                    <button type="submit">Зарегистрироваться</button>
                </form>
            </div>
            <footer>
                <p>Have a happy day ♡</p>
            </footer>
        </div>
    </div> 
</body> 
</html>
